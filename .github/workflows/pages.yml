name: Site (GitHub Pages)

# Publie le dossier site/ (statique, sans build) sur GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "tools/**"
      - "crates/common/rules.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Le site doit refléter rules.json : on régénère les blocs et on échoue s'il y a dérive.
      - name: Régénérer les blocs depuis rules.json (aucune dérive tolérée)
        run: |
          python3 tools/gen_site.py . site/index.html fr
          python3 tools/gen_site.py . site/en/index.html en
          git diff --exit-code site/ || { echo "::error::site/ n'est pas à jour : lancer tools/gen_site.py (voir tools/README.md) et committer"; exit 1; }
      - name: Contrôler les pages
        run: python3 tools/check_site.py site/index.html site/en/index.html site/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
