[workspace]
resolver = "2"
members = [
  "crates/common",
  "crates/sensor-windows",
  "crates/sensor-proc",
  "crates/console",
  "crates/agentd",
  "crates/proto",
  "crates/server",
  "crates/agent",
  "crates/certgen",
  "crates/scan",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
