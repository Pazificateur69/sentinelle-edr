[package]
name = "sentinelle-agentd"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Agent Sentinelle mono-poste : capteur -> moteur -> console temps reel + reponse"
default-run = "sentinelle-agentd"

[dependencies]
sentinelle-common = { path = "../common" }
sentinelle-console = { path = "../console" }
serde_json.workspace = true
chrono.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }

[target.'cfg(windows)'.dependencies]
sentinelle-sensor-windows = { path = "../sensor-windows" }
windows = { version = "0.58", features = ["Win32_System_Threading", "Win32_Foundation"] }
