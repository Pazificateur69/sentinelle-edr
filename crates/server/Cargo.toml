[package]
name = "sentinelle-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Serveur de parc Sentinelle : ingestion gRPC (mTLS) multi-agents + console multi-hotes"

[dependencies]
sentinelle-common = { path = "../common" }
sentinelle-console = { path = "../console" }
sentinelle-proto = { path = "../proto" }
tonic = { version = "0.14", features = ["tls-ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net"] }
tokio-stream = { version = "0.1", features = ["net"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true

[dev-dependencies]
sentinelle-certgen = { path = "../certgen" }
tempfile = "3"
